[build-system]
requires = ["flit_core>=3.9"]
build-backend = "flit_core.buildapi"

[project]
name = "linux-mcp"
version = "0.16.0"
description = "Linux AI server: REST API daemon and native MCP server for Ubuntu and other Linux distributions"
readme = "README.md"
license = {text = "AGPL-3.0"}
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
authors = [{name = "FarizGD"}]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
linux-mcp = "termux_mcp.__main__:run"
linux-native-mcp = "termux_mcp.mcp_main:main"
termux-mcp = "termux_mcp.__main__:run"
termux-native-mcp = "termux_mcp.mcp_main:main"

[tool.flit.module]
name = "termux_mcp"
